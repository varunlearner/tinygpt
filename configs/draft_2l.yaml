# ~3.2M parameter shallow draft (2 layers, d=256) for the draft-size ablation in E3.
name: draft_2l
model:
  vocab_size: 4096
  d_model: 256
  n_layers: 2
  n_heads: 4
  n_kv_heads: 4
  mlp_hidden: 704
  max_seq_len: 512
train:
  data_dir: data/shards
  out_dir: runs/draft_2l
  micro_batch_size: 64
  grad_accum_steps: 2
  epochs: 1.0
  lr: 2.0e-3
  warmup_steps: 300
  ckpt_interval_steps: 1000
